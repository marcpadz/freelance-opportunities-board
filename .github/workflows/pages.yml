name: Deploy freelance opportunities board

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Enrich blank Notion fields and refresh website snapshot
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          if [ -n "${NOTION_API_TOKEN:-}" ]; then
            node scripts/enrich-notion.mjs
            node scripts/sync-notion.mjs
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::error::NOTION_API_TOKEN repository secret is required for automatic Notion sync."
            exit 1
          else
            echo "::warning::NOTION_API_TOKEN repository secret is absent. Deploying the checked-in snapshot; automatic enrichment awaits configuration."
          fi
      - name: Build static frontend
        env:
          VITE_STATIC_ONLY: "true"
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
